baseURL = "https://go-pdfkit.github.io/docs/"
title = "go-pdfkit"
# ⛔ `locale`, not `languageCode`: deprecated in Hugo 0.158.0. Both this and
# cascade.target below were found by building with --panicOnWarning, which this
# site's workflow does not pass — a deprecation that fails no build is one
# nobody sees until the release that removes it.
locale = "en"

# ⛔ Hugo + Hextra, and no Python. What this replaced was MkDocs Material plus
# mike, which needed a Python toolchain, a requirements.txt and a pip install
# in CI to render a static site for a pure-Go organisation.
[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"

enableGitInfo = true

# ⛔ The content is NOT under content/docs. This site is served AT /docs/, so a
# `docs` section would make every page /docs/docs/… -- which it did, and which
# broke all nineteen internal links at once, because they are written /docs/…
# and that is the site root here.
#
# Hextra picks its documentation layout from the section being called `docs`,
# so with the content at the root the type is cascaded instead.
[[cascade]]
  [cascade.params]
    type = "docs"
  # ⛔ `target`, not `_target`: the underscored spelling was deprecated in Hugo
  # 0.156.0, and a build with --panicOnWarning refuses it outright. It was
  # silent here because this site's workflow does not pass that flag, so the
  # deprecation sat in the config waiting for the release that removes it.
  [cascade.target]
    path = "/**"

[markup.highlight]
  noClasses = false

[markup.goldmark.renderer]
  unsafe = true

[params]
  description = "The whole of PDF in pure Go with no C anywhere: read a file, write one, rearrange it, draw it, read it back as words and pictures, and edit it with other people — in a browser tab."

  [params.navbar]
    displayTitle = true
    displayLogo = true
    [params.navbar.logo]
      path = "images/logo.svg"
      width = 24
      height = 24

  [params.footer]
    enable = true
    displayCopyright = true
    displayPoweredBy = false

  [params.editURL]
    enable = true
    base = "https://github.com/go-pdfkit/docs/edit/main/content"

