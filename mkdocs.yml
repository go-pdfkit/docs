site_name: go-pdfkit docs
site_description: "The whole of PDF in pure Go with no C anywhere: read a file, write one, rearrange it, draw it, read it back as words and pictures, and edit it with other people — in a browser tab."
site_url: https://go-pdfkit.github.io/docs/
repo_url: https://github.com/go-pdfkit
repo_name: go-pdfkit
edit_uri: ""

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - content.code.copy
    - search.suggest
  palette:
    # System default (follows the OS preference), then explicit light and dark.
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

extra:
  version:
    provider: mike
    default: latest

nav:
  - Overview: index.md
  - Working with a file:
      - Reading a file: reading.md
      - Rearranging a file: operations.md
      - Drawing a page: rendering.md
      - Reading a page back: extraction.md
      - Editing together: coediting.md
      - The browser workbench: workbench.md
  - Writing a document:
      - Getting started: getting-started.md
      - Graphics: graphics.md
      - Text & fonts: text-and-fonts.md
      - Images: images.md
      - Widgets: widgets.md
  - API reference: api.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
