# Build the documentation, and publish it from main.
#
# ⛔ No Python. What this replaced was MkDocs Material plus mike: a
# requirements.txt, a pip install and a Python setup step, to render a static
# site for an organisation whose whole argument is that it needs no runtime but
# Go. Hugo is one binary, and the theme is a Go module.
name: docs

on:
  push:
    branches: [main]
  # On a pull request too, so a change that breaks the build is caught before
  # it lands rather than by the published site going stale.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The theme reads the last-modified date of each page from git, so a
          # shallow clone would date every page to the checkout.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          # Pinned: Hugo modules are Go modules, and the resolver is the one in
          # this toolchain.
          go-version: '1.27.2'

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.167.0'
          extended: true

      - uses: actions/configure-pages@v6
        id: pages

      - name: Build
        # --minify and the base URL Pages computes, the same way the landing
        # repository does it.
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Say which theme built it
        # The theme is a FORK reached through a replace directive. Printing the
        # resolved module means a build that silently fell back to upstream is
        # visible in the log rather than in the rendering.
        run: hugo mod graph | head -5

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
